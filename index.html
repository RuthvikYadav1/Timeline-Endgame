<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Jul 31 → Aug 17 · Chicago &amp; New York</title>
<style>
  :root {
    --font-display: "Bahnschrift", "DIN Alternate", "Franklin Gothic Medium", "Arial Narrow", "Helvetica Neue", sans-serif;
    --font-body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Cascadia Mono", Consolas, ui-monospace, "SF Mono", Menlo, monospace;

    --bg: #e9ecf1;
    --surface: #ffffff;
    --surface-2: #f2f4f8;
    --ink: #12161d;
    --ink-2: #39424f;
    --muted: #626d7d;
    --line: #ccd3dd;
    --line-strong: #aab4c2;
    --shadow: 0 1px 2px rgba(18, 22, 29, .06), 0 8px 24px -12px rgba(18, 22, 29, .18);
    --focus: #0b6bb5;

    --c-art: #0072ad;
    --c-food: #c00c30;
    --c-people: #cc3b0e;
    --c-hood: #007a38;
    --c-travel: #5a2eae;
    --c-mile: #b64a76;
    --c-todo: #8a6d00;
    --tint: 14%;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1117;
      --surface: #171b23;
      --surface-2: #1d222c;
      --ink: #e8ecf3;
      --ink-2: #c2cad6;
      --muted: #8b96a7;
      --line: #272d38;
      --line-strong: #3a424f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px -14px rgba(0, 0, 0, .7);
      --focus: #55b6f0;

      --c-art: #35b6ee;
      --c-food: #ff5470;
      --c-people: #ff8149;
      --c-hood: #3ed27f;
      --c-travel: #ab8dff;
      --c-mile: #f49ac2;
      --c-todo: #f2d24a;
      --tint: 20%;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0e1117;
    --surface: #171b23;
    --surface-2: #1d222c;
    --ink: #e8ecf3;
    --ink-2: #c2cad6;
    --muted: #8b96a7;
    --line: #272d38;
    --line-strong: #3a424f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px -14px rgba(0, 0, 0, .7);
    --focus: #55b6f0;

    --c-art: #35b6ee;
    --c-food: #ff5470;
    --c-people: #ff8149;
    --c-hood: #3ed27f;
    --c-travel: #ab8dff;
    --c-mile: #f49ac2;
    --c-todo: #f2d24a;
    --tint: 20%;
  }

  :root[data-theme="light"] {
    --bg: #e9ecf1;
    --surface: #ffffff;
    --surface-2: #f2f4f8;
    --ink: #12161d;
    --ink-2: #39424f;
    --muted: #626d7d;
    --line: #ccd3dd;
    --line-strong: #aab4c2;
    --shadow: 0 1px 2px rgba(18, 22, 29, .06), 0 8px 24px -12px rgba(18, 22, 29, .18);
    --focus: #0b6bb5;

    --c-art: #0072ad;
    --c-food: #c00c30;
    --c-people: #cc3b0e;
    --c-hood: #007a38;
    --c-travel: #5a2eae;
    --c-mile: #b64a76;
    --c-todo: #8a6d00;
    --tint: 14%;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 3px;
  }

  .page {
    max-width: 1220px;
    margin: 0 auto;
    padding: 28px 20px 96px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* ---------- masthead ---------- */

  .masthead {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .linestripe {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    height: 7px;
    border-radius: 4px;
    overflow: hidden;
  }

  .mh-top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
  }

  .eyebrow {
    margin: 0 0 2px;
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .title {
    margin: 0;
    font-family: var(--font-display);
    font-variation-settings: 'wght' 700, 'wdth' 85;
    font-weight: 700;
    font-size: clamp(38px, 7vw, 62px);
    line-height: .95;
    letter-spacing: .01em;
    text-transform: uppercase;
    text-wrap: balance;
  }

  .lede {
    margin: 8px 0 0;
    max-width: 56ch;
    color: var(--ink-2);
  }

  .countdown {
    flex: 0 0 auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 16px;
    box-shadow: var(--shadow);
    text-align: right;
  }

  .countdown .cd-num {
    display: block;
    font-family: var(--font-mono);
    font-size: 30px;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }

  .countdown .cd-label {
    display: block;
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 26px;
    padding-top: 4px;
    border-top: 1px solid var(--line);
  }

  .stat {
    display: flex;
    align-items: baseline;
    gap: 7px;
  }

  .stat b {
    font-family: var(--font-mono);
    font-size: 17px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }

  .stat span {
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- filters ---------- */

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .filter {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px 5px 9px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-2);
    border-radius: 999px;
    font-family: var(--font-display);
    font-size: 11.5px;
    letter-spacing: .13em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color .15s, color .15s, opacity .15s;
  }

  .filter:hover { border-color: var(--line-strong); }

  .filter .swatch {
    width: 11px;
    height: 11px;
    border-radius: 3px;
    background: var(--cat);
    flex: 0 0 auto;
  }

  .filter[aria-pressed="false"] {
    opacity: .42;
    text-decoration: line-through;
  }

  .toolbar .spacer { flex: 1 1 auto; }

  .ghost-btn {
    padding: 6px 13px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    font-family: var(--font-display);
    font-size: 11.5px;
    letter-spacing: .13em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }

  .ghost-btn:hover { color: var(--ink); border-color: var(--line-strong); }

  /* ---------- layout ---------- */

  .board {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 20px;
    align-items: start;
  }

  @media (min-width: 980px) {
    .board { grid-template-columns: minmax(0, 1fr) 348px; }
  }

  .grid-wrap { overflow-x: auto; padding-bottom: 4px; }

  .cal {
    min-width: 540px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .dow {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }

  .dow div {
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
    padding-left: 2px;
  }

  .week { display: flex; flex-direction: column; gap: 6px; }

  .lane, .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }

  .ribbon {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--cat);
    color: var(--surface);
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: .16em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
  }

  :root[data-theme="dark"] .ribbon, :root[data-theme="dark"] .ribbon-days { color: #10131a; }

  @media (prefers-color-scheme: dark) {
    .ribbon, .ribbon-days { color: #10131a; }
  }

  :root[data-theme="light"] .ribbon, :root[data-theme="light"] .ribbon-days { color: #ffffff; }

  .ribbon-days {
    font-family: var(--font-mono);
    letter-spacing: 0;
    opacity: .8;
    text-transform: none;
  }

  .day {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 116px;
    padding: 8px 8px 10px;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: inherit;
    font: inherit;
    cursor: pointer;
    transition: border-color .15s, transform .15s, box-shadow .15s;
  }

  .day:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }

  .day.is-selected {
    border-color: var(--ink);
    box-shadow: 0 0 0 1px var(--ink);
  }

  .day.is-out {
    background: transparent;
    border-style: dashed;
    border-color: var(--line);
    opacity: .45;
    cursor: default;
    min-height: 68px;
  }

  .day.is-out:hover { border-color: var(--line); box-shadow: none; }

  .day.is-milestone {
    background: color-mix(in srgb, var(--c-mile) var(--tint), var(--surface));
    border-color: color-mix(in srgb, var(--c-mile) 40%, var(--line));
  }

  .day.is-today::after {
    content: "";
    position: absolute;
    inset: -1px;
    border: 2px solid var(--focus);
    border-radius: 10px;
    pointer-events: none;
  }

  .dnum {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    font-weight: 600;
  }

  .dnum .mon {
    font-family: var(--font-display);
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 400;
  }

  .chips { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    padding: 2px 6px 2px 5px;
    border-radius: 5px;
    background: color-mix(in srgb, var(--cat) var(--tint), var(--surface));
    border-left: 3px solid var(--cat);
    font-size: 12px;
    line-height: 1.35;
  }

  .chip .ct {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .chip .cm {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    white-space: nowrap;
  }

  .chip.is-done .ct { text-decoration: line-through; opacity: .55; }

  .dots { display: none; gap: 4px; flex-wrap: wrap; }

  .dots i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--cat);
  }

  /* ---------- rail ---------- */

  .rail {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  @media (min-width: 980px) {
    .rail { position: sticky; top: 20px; }
  }

  .rail-head {
    padding: 16px 18px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .rail-dow {
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .rail-date {
    font-family: var(--font-display);
    font-variation-settings: 'wght' 700, 'wdth' 85;
    font-weight: 700;
    font-size: 27px;
    line-height: 1.1;
    text-transform: uppercase;
  }

  .rail-meta {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .rail-close {
    display: none;
    position: absolute;
    top: 12px;
    right: 14px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }

  .rail-body {
    padding: 14px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 52vh;
    overflow-y: auto;
  }

  .empty {
    color: var(--muted);
    font-size: 13.5px;
    padding: 6px 0 2px;
  }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 10px 9px 11px;
    border-radius: 9px;
    background: var(--surface-2);
    border-left: 4px solid var(--cat);
  }

  .item-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

  .item-title { font-weight: 600; line-height: 1.35; word-break: break-word; }

  .item.is-done .item-title { text-decoration: line-through; opacity: .5; }

  .item-sub {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 11.5px;
    color: var(--muted);
  }

  .time-chip {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 11.5px;
    letter-spacing: .02em;
    padding: 1px 6px;
    border-radius: 4px;
    background: color-mix(in srgb, var(--cat) var(--tint), var(--surface));
    color: var(--ink-2);
  }

  .cat-tag {
    font-family: var(--font-display);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--cat);
  }

  .item-check {
    width: 17px;
    height: 17px;
    margin-top: 3px;
    accent-color: var(--cat);
    cursor: pointer;
    flex: 0 0 auto;
  }

  .item-del {
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }

  .item-del:hover { background: var(--surface); color: var(--c-food); }

  .rail-foot { padding: 12px 18px 16px; border-top: 1px solid var(--line); }

  .add-form { display: none; flex-direction: column; gap: 8px; }
  .add-form.is-open { display: flex; }

  .add-row { display: flex; gap: 8px; }
  .add-row > * { min-width: 0; }

  .fld {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
  }

  .fld::placeholder { color: var(--muted); }

  .add-row .fld.time { flex: 0 0 118px; font-family: var(--font-mono); }
  .add-row .fld.cat { flex: 1 1 auto; }

  .primary-btn {
    width: 100%;
    padding: 9px 14px;
    border: 0;
    border-radius: 8px;
    background: var(--ink);
    color: var(--surface);
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: .16em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .primary-btn:hover { opacity: .88; }

  .legend-note {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }

  /* ---------- responsive ---------- */

  @media (max-width: 979px) {
    .rail {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      border-radius: 14px 14px 0 0;
      border-bottom: 0;
      transform: translateY(105%);
      transition: transform .24s ease;
      max-height: 82vh;
      overflow-y: auto;
    }

    .rail.is-open { transform: translateY(0); }
    .rail-close { display: block; }
    .rail-head { position: relative; }
    .rail-body { max-height: none; }
  }

  @media (max-width: 640px) {
    .page { padding: 20px 14px 80px; }
    .cal { min-width: 500px; }
    .day { min-height: 92px; }
    .chips { display: none; }
    .dots { display: flex; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="page">
  <header class="masthead">
    <div class="linestripe" id="linestripe"></div>
    <div class="mh-top">
      <div>
        <p class="eyebrow">Chicago &middot; New York</p>
        <h1 class="title">Jul 31 &rarr; Aug 17</h1>
        <p class="lede">Eighteen days of museums, dinner reservations and one flight east. Pick a day to see it, add to it, or check things off.</p>
      </div>
      <div class="countdown">
        <span class="cd-num" id="cdNum">&mdash;</span>
        <span class="cd-label" id="cdLabel">loading</span>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="toolbar" id="toolbar"></div>

  <div class="board">
    <div class="grid-wrap">
      <div class="cal" id="cal"></div>
    </div>

    <aside class="rail" id="rail" aria-label="Day detail">
      <div class="rail-head">
        <span class="rail-dow" id="railDow">Friday</span>
        <span class="rail-date" id="railDate">Jul 31</span>
        <span class="rail-meta" id="railMeta">Day 1 of 18</span>
        <button class="rail-close" id="railClose" aria-label="Close day detail">&times;</button>
      </div>
      <div class="rail-body" id="railBody"></div>
      <div class="rail-foot">
        <form class="add-form" id="addForm">
          <input class="fld" id="fTitle" type="text" placeholder="What's the plan?" maxlength="80" required />
          <div class="add-row">
            <input class="fld time" id="fTime" type="time" aria-label="Time" />
            <select class="fld cat" id="fCat" aria-label="Category"></select>
          </div>
          <button class="primary-btn" type="submit">Add to this day</button>
        </form>
        <button class="ghost-btn" id="addToggle" style="width:100%">+ Add a plan</button>
      </div>
    </aside>
  </div>

  <p class="legend-note">Changes save in this browser. Arrow keys move between days.</p>
</div>

<script>
  (function () {
    'use strict';

    var START = '2026-07-31';
    var END = '2026-08-17';
    var KEY = 'itinerary-jul31-aug17-v2';

    var CATS = {
      art:    { label: 'Sights & Museums', v: '--c-art' },
      food:   { label: 'Food & Drink',  v: '--c-food' },
      people: { label: 'People',        v: '--c-people' },
      hood:   { label: 'Neighborhoods', v: '--c-hood' },
      travel: { label: 'Travel',        v: '--c-travel' },
      mile:   { label: 'Milestone',     v: '--c-mile' },
      todo:   { label: 'To-do',         v: '--c-todo' }
    };
    var CAT_ORDER = ['art', 'food', 'people', 'hood', 'travel', 'mile', 'todo'];

    var SEED = [
      { id: 'a1', date: '2026-07-31', title: 'WNDR Museum', cat: 'art' },
      { id: 'a14', date: '2026-07-31', title: "Pequod's Pizza", cat: 'food' },
      { id: 'a2', date: '2026-08-01', title: 'MCCB', time: '20:00', cat: 'food', note: 'Restaurant' },
      { id: 'a3', date: '2026-08-02', title: "Andy's", time: '20:00', cat: 'food' },
      { id: 'a4', date: '2026-08-03', title: 'Rosemont', cat: 'hood' },
      { id: 'a5', date: '2026-08-04', title: 'Tony uncle', cat: 'people' },
      { id: 'a6', date: '2026-08-05', title: 'Damen', cat: 'hood' },
      { id: 'a7', date: '2026-08-05', title: 'Velvet Taco', cat: 'food' },
      { id: 'a8', date: '2026-08-06', title: 'Balloon Museum', cat: 'art' },
      { id: 'a9', date: '2026-08-06', title: 'Finish the reel', cat: 'todo', done: false },
      { id: 'a10', date: '2026-08-07', title: 'Skydeck', cat: 'art' },
      { id: 'a11', date: '2026-08-07', title: 'Color Factory', cat: 'art' },
      { id: 'a12', date: '2026-08-09', end: '2026-08-13', title: 'New York', cat: 'travel' },
      { id: 'a13', date: '2026-08-14', title: 'My birthday', cat: 'mile' }
    ];

    var DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
    function iso(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function addDays(d, n) { var c = new Date(d.getTime()); c.setDate(c.getDate() + n); return c; }
    function dayDiff(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function fmtTime(t) {
      if (!t) return '';
      var p = t.split(':'), h = +p[0], m = p[1];
      var ap = h >= 12 ? 'PM' : 'AM';
      var h12 = h % 12 === 0 ? 12 : h % 12;
      return h12 + ':' + m + ' ' + ap;
    }
    function inRange(d) { return d >= START && d <= END; }

    var events = load();
    var selected = START;
    var active = {};
    CAT_ORDER.forEach(function (c) { active[c] = true; });

    function load() {
      try {
        var raw = localStorage.getItem(KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed;
        }
      } catch (e) { /* fall through to seed */ }
      return SEED.map(function (e) { return Object.assign({}, e); });
    }

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(events)); } catch (e) { /* storage unavailable */ }
    }

    function eventsOn(date) {
      return events.filter(function (e) {
        return e.end ? (date >= e.date && date <= e.end) : e.date === date;
      }).sort(function (a, b) {
        if (!!a.end !== !!b.end) return a.end ? -1 : 1;
        return (a.time || '99:99').localeCompare(b.time || '99:99');
      });
    }

    /* ---------- masthead ---------- */

    function renderStripe() {
      document.getElementById('linestripe').innerHTML = CAT_ORDER.map(function (c) {
        return '<div style="background:var(' + CATS[c].v + ')"></div>';
      }).join('');
    }

    function renderCountdown() {
      var today = iso(new Date());
      var num, label;
      if (today < START) {
        num = dayDiff(today, START);
        label = num === 1 ? 'day until Jul 31' : 'days until Jul 31';
      } else if (today > END) {
        num = '✓';
        label = 'that\'s a wrap';
      } else {
        num = dayDiff(START, today) + 1;
        label = 'of 18 &mdash; today';
      }
      document.getElementById('cdNum').textContent = num;
      document.getElementById('cdLabel').innerHTML = label;
    }

    function renderStats() {
      var total = events.length;
      var ny = events.filter(function (e) { return e.cat === 'travel'; })
        .reduce(function (n, e) { return n + (e.end ? dayDiff(e.date, e.end) + 1 : 1); }, 0);
      var open = events.filter(function (e) { return e.cat === 'todo' && !e.done; }).length;
      var booked = {};
      events.forEach(function (e) {
        if (e.end) { for (var i = 0; i <= dayDiff(e.date, e.end); i++) booked[iso(addDays(parse(e.date), i))] = 1; }
        else booked[e.date] = 1;
      });
      var free = 18 - Object.keys(booked).filter(inRange).length;

      var rows = [
        [total, 'plans'],
        [ny, 'days in New York'],
        [free, free === 1 ? 'open day' : 'open days'],
        [open, open === 1 ? 'thing to finish' : 'things to finish']
      ];
      document.getElementById('stats').innerHTML = rows.map(function (r) {
        return '<div class="stat"><b>' + r[0] + '</b><span>' + r[1] + '</span></div>';
      }).join('');
    }

    /* ---------- filters ---------- */

    function renderToolbar() {
      var tb = document.getElementById('toolbar');
      tb.innerHTML = CAT_ORDER.map(function (c) {
        return '<button class="filter" data-cat="' + c + '" aria-pressed="' + active[c] + '" style="--cat:var(' + CATS[c].v + ')">' +
          '<span class="swatch"></span>' + esc(CATS[c].label) + '</button>';
      }).join('') +
        '<span class="spacer"></span>' +
        '<button class="ghost-btn" id="resetBtn">Reset plan</button>';

      tb.querySelectorAll('.filter').forEach(function (b) {
        b.addEventListener('click', function () {
          var c = b.dataset.cat;
          active[c] = !active[c];
          b.setAttribute('aria-pressed', String(active[c]));
          renderCal();
        });
      });

      document.getElementById('resetBtn').addEventListener('click', function () {
        if (!confirm('Reset back to the original plan? Anything you added will be removed.')) return;
        events = SEED.map(function (e) { return Object.assign({}, e); });
        save();
        renderAll();
      });
    }

    /* ---------- calendar ---------- */

    function renderCal() {
      var cal = document.getElementById('cal');
      var first = parse(START);
      var gridStart = addDays(first, -first.getDay());
      var last = parse(END);
      var gridEnd = addDays(last, 6 - last.getDay());
      var today = iso(new Date());

      var html = '<div class="dow">' + ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
        .map(function (d) { return '<div>' + d + '</div>'; }).join('') + '</div>';

      for (var w = new Date(gridStart.getTime()); w <= gridEnd; w = addDays(w, 7)) {
        var weekStart = iso(w);
        var weekEnd = iso(addDays(w, 6));
        html += '<div class="week">';

        // multi-day ribbons that overlap this week
        var spans = events.filter(function (e) {
          return e.end && active[e.cat] && e.date <= weekEnd && e.end >= weekStart;
        });
        if (spans.length) {
          html += '<div class="lane">' + spans.map(function (e) {
            var s = Math.max(0, dayDiff(weekStart, e.date));
            var en = Math.min(6, dayDiff(weekStart, e.end));
            var d1 = parse(e.date), d2 = parse(e.end);
            var range = MON[d1.getMonth()] + ' ' + d1.getDate() + '–' + d2.getDate();
            return '<div class="ribbon" style="--cat:var(' + CATS[e.cat].v + ');grid-column:' + (s + 1) + '/span ' + (en - s + 1) + '">' +
              '<span>' + esc(e.title) + '</span><span class="ribbon-days">' + range + '</span></div>';
          }).join('') + '</div>';
        }

        html += '<div class="days">';
        for (var i = 0; i < 7; i++) {
          var dt = addDays(w, i);
          var key = iso(dt);
          var out = !inRange(key);
          var evs = out ? [] : eventsOn(key).filter(function (e) { return active[e.cat] && !e.end; });
          var isMile = !out && eventsOn(key).some(function (e) { return e.cat === 'mile'; });

          var cls = 'day' + (out ? ' is-out' : '') + (key === selected && !out ? ' is-selected' : '') +
            (isMile ? ' is-milestone' : '') + (key === today ? ' is-today' : '');

          html += '<' + (out ? 'div' : 'button type="button"') + ' class="' + cls + '" data-date="' + key + '"' +
            (out ? '' : ' aria-pressed="' + (key === selected) + '"') + '>' +
            '<span class="dnum">' + dt.getDate() +
            (dt.getDate() === 1 || key === START ? '<span class="mon">' + MON[dt.getMonth()] + '</span>' : '') +
            '</span>';

          if (evs.length) {
            html += '<span class="chips">' + evs.map(function (e) {
              return '<span class="chip' + (e.done ? ' is-done' : '') + '" style="--cat:var(' + CATS[e.cat].v + ')">' +
                '<span class="ct">' + esc(e.title) + '</span>' +
                (e.time ? '<span class="cm">' + fmtTime(e.time) + '</span>' : '') + '</span>';
            }).join('') + '</span>';
            html += '<span class="dots">' + evs.map(function (e) {
              return '<i style="--cat:var(' + CATS[e.cat].v + ')"></i>';
            }).join('') + '</span>';
          }

          html += out ? '</div>' : '</button>';
        }
        html += '</div></div>';
      }

      cal.innerHTML = html;

      cal.querySelectorAll('.day[data-date]:not(.is-out)').forEach(function (b) {
        b.addEventListener('click', function () { select(b.dataset.date, true); });
        b.addEventListener('keydown', onDayKey);
      });
    }

    function onDayKey(ev) {
      var step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[ev.key];
      if (!step) return;
      ev.preventDefault();
      var next = iso(addDays(parse(ev.currentTarget.dataset.date), step));
      if (!inRange(next)) return;
      select(next, false);
      var el = document.querySelector('.day[data-date="' + next + '"]');
      if (el) el.focus();
    }

    /* ---------- rail ---------- */

    function select(date, openSheet) {
      selected = date;
      renderCal();
      renderRail();
      if (openSheet && window.matchMedia('(max-width: 979px)').matches) {
        document.getElementById('rail').classList.add('is-open');
      }
    }

    function renderRail() {
      var d = parse(selected);
      document.getElementById('railDow').textContent = DOW[d.getDay()];
      document.getElementById('railDate').textContent = MON[d.getMonth()] + ' ' + d.getDate();
      document.getElementById('railMeta').textContent = 'Day ' + (dayDiff(START, selected) + 1) + ' of 18';

      var list = eventsOn(selected);
      var body = document.getElementById('railBody');

      if (!list.length) {
        body.innerHTML = '<p class="empty">Nothing here yet. Add something below.</p>';
        return;
      }

      body.innerHTML = list.map(function (e) {
        var span = e.end ? MON[parse(e.date).getMonth()] + ' ' + parse(e.date).getDate() + '–' + parse(e.end).getDate() : '';
        return '<div class="item' + (e.done ? ' is-done' : '') + '" style="--cat:var(' + CATS[e.cat].v + ')">' +
          (e.cat === 'todo' ? '<input class="item-check" type="checkbox" data-check="' + e.id + '"' + (e.done ? ' checked' : '') + ' aria-label="Mark done" />' : '') +
          '<div class="item-main">' +
            '<span class="item-title">' + esc(e.title) + '</span>' +
            '<span class="item-sub">' +
              (e.time ? '<span class="time-chip">' + fmtTime(e.time) + '</span>' : '') +
              (span ? '<span class="time-chip">' + span + '</span>' : '') +
              '<span class="cat-tag">' + esc(CATS[e.cat].label) + '</span>' +
              (e.note ? '<span>' + esc(e.note) + '</span>' : '') +
            '</span>' +
          '</div>' +
          '<button class="item-del" data-del="' + e.id + '" aria-label="Remove ' + esc(e.title) + '">&times;</button>' +
        '</div>';
      }).join('');

      body.querySelectorAll('[data-del]').forEach(function (b) {
        b.addEventListener('click', function () {
          events = events.filter(function (e) { return e.id !== b.dataset.del; });
          save();
          renderAll();
        });
      });

      body.querySelectorAll('[data-check]').forEach(function (c) {
        c.addEventListener('change', function () {
          var ev = events.find(function (e) { return e.id === c.dataset.check; });
          if (ev) { ev.done = c.checked; save(); renderAll(); }
        });
      });
    }

    /* ---------- add form ---------- */

    function setupForm() {
      var sel = document.getElementById('fCat');
      sel.innerHTML = CAT_ORDER.map(function (c) {
        return '<option value="' + c + '">' + esc(CATS[c].label) + '</option>';
      }).join('');

      var form = document.getElementById('addForm');
      var toggle = document.getElementById('addToggle');

      toggle.addEventListener('click', function () {
        var open = form.classList.toggle('is-open');
        toggle.textContent = open ? 'Cancel' : '+ Add a plan';
        if (open) document.getElementById('fTitle').focus();
      });

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var title = document.getElementById('fTitle').value.trim();
        if (!title) return;
        events.push({
          id: 'u' + Date.now(),
          date: selected,
          title: title,
          time: document.getElementById('fTime').value || '',
          cat: sel.value,
          done: false
        });
        save();
        form.reset();
        renderAll();
        document.getElementById('fTitle').focus();
      });

      document.getElementById('railClose').addEventListener('click', function () {
        document.getElementById('rail').classList.remove('is-open');
      });
    }

    function renderAll() {
      renderStats();
      renderCountdown();
      renderCal();
      renderRail();
    }

    var todayIso = iso(new Date());
    if (inRange(todayIso)) selected = todayIso;

    renderStripe();
    renderToolbar();
    setupForm();
    renderAll();
  })();
</script>

</body>
</html>
